name: Generate & Publish Smoke Report

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [smoke-results-update]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. Checkout REPORTS repo (this repo)
      - name: Checkout Reports repository
        uses: actions/checkout@v4

      # ✅ 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔐 3. Clone PRIVATE Allure Results repo
      - name: Clone Allure Results (Private Repo)
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/TmpRSN/Allure-Results.git results-repo

      # 📁 4. Prepare SMOKE allure-results
      - name: Prepare Allure Results
        run: |
          mkdir -p allure-results
          cp -r results-repo/smoke-results/. allure-results/

      # 🔥 5. Restore SMOKE HISTORY (Trend Support)
      - name: Restore Allure History
        run: |
          git clone --depth 1 --branch gh-pages https://github.com/${{ github.repository }} gh-pages || echo "No gh-pages yet"

          if [ -d "gh-pages/smoke/history" ]; then
            echo "Restoring history..."
            mkdir -p allure-results/history
            cp -r gh-pages/smoke/history/* allure-results/history/
          else
            echo "No history found (first run)"
          fi

      # 🧹 6. Keep only latest 10 trend runs
      - name: Trim Allure History
        run: |
          for file in history-trend.json duration-trend.json retry-trend.json categories-trend.json
          do
            if [ -f "allure-results/history/$file" ]; then
              jq '.[-10:]' "allure-results/history/$file" > temp.json
              mv temp.json "allure-results/history/$file"
            fi
          done

          if [ -f "allure-results/history/history.json" ]; then
            jq 'to_entries | map(.value.items = (.value.items | if length > 10 then .[-10:] else . end) | .value.statistic = (.value.items | {
              failed: (map(select(.status == "failed")) | length),
              broken: (map(select(.status == "broken")) | length),
              passed: (map(select(.status == "passed")) | length),
              skipped: (map(select(.status == "skipped")) | length),
              unknown: (map(select(.status == "unknown")) | length),
              total: length
            })) | from_entries' allure-results/history/history.json > temp.json

            mv temp.json allure-results/history/history.json
          fi

      # 🔍 7. Debug files
      - name: Debug files
        run: |
          echo "===== Allure Results ====="
          ls -R allure-results || true

      # ✅ 8. Install Allure
      - name: Install Allure Commandline
        run: |
          npm install -g allure-commandline@2.43.0
          allure --version

      # ✅ 9. Generate Allure Report
      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      # 🎨 10. Customize Allure Report
      - name: Customize Allure Report
        run: |
          mkdir -p allure-report/app

          cp .github/allure-assets/rs-logo.png allure-report/app/rs-logo.png
          cp .github/allure-assets/styles.css allure-report/app/styles.css
          cp .github/allure-assets/rs-favicon.ico allure-report/favicon.ico

          sed -i 's#</head>#<link rel="stylesheet" href="app/styles.css"></head>#' allure-report/index.html
          sed -i 's#<title>Allure Report</title>#<title>Test Report</title>#' allure-report/index.html
          sed -i 's#href="assets/favicon[^"]*\.ico"#href="favicon.ico"#g' allure-report/index.html
          sed -i 's#"reportName":"Allure Report"#"reportName":"Test Report"#g' allure-report/widgets/summary.json

      # 🔥 11. Fix GitHub Pages routing
      - name: Fix GitHub Pages routing
        run: |
          cp allure-report/index.html allure-report/404.html

      # 📦 12. Prepare SMOKE Pages Folder
      - name: Prepare Smoke Pages Folder
        run: |
          mkdir -p deploy/smoke
          cp -r allure-report/* deploy/smoke/

      # 🚀 13. Deploy SMOKE report to GitHub Pages
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          keep_files: true
