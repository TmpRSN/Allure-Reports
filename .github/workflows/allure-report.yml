name: Generate & Publish Allure Report

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [allure-update]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Reports repository
        uses: actions/checkout@v3

      - name: Clone Allure Results (Private Repo)
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/TmpRSN/Allure-Results.git results-repo

      - name: Prepare Allure Results
        run: |
          mkdir -p allure-results
          cp -r results-repo/allure-results/. allure-results/

      - name: Install Allure
        run: |
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.39.0/allure-2.39.0.tgz
          tar -zxvf allure.tgz
          sudo mv allure-2.39.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      # 🔥 VERSIONING FIX (REAL SOLUTION)
      - name: Prepare versioned report
        run: |
          VERSION=$(date +%s)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          mkdir -p deploy/$VERSION
          cp -r allure-report/* deploy/$VERSION/

      # 🔥 Create redirect to latest report
      - name: Create index redirect
        run: |
          cat <<EOF > deploy/index.html
          <html>
          <head>
              <meta http-equiv="refresh" content="0; url=./$VERSION/">
          </head>
          <body>
              Redirecting to latest report...
          </body>
          </html>
          EOF

      - name: Add .nojekyll
        run: |
          touch deploy/.nojekyll

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
