name: Generate & Publish Allure Report

on:
push:
branches:
- main

repository_dispatch:
types: [allure-update]

permissions:
contents: write

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:

  # ✅ 1. Checkout REPORTS repo
  - name: Checkout Reports repository
    uses: actions/checkout@v3

  # 🔐 2. Clone PRIVATE Allure Results repo
  - name: Clone Allure Results (Private Repo)
    run: |
      git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/TmpRSN/Allure-Results.git results-repo

  # 📁 3. Prepare allure-results
  - name: Prepare Allure Results
    run: |
      mkdir -p allure-results
      cp -r results-repo/allure-results/. allure-results/

  # 🔥 4. Restore History from gh-pages
  - name: Restore Allure History
    run: |
      git clone --depth 1 --branch gh-pages https://github.com/${{ github.repository }} gh-pages || true

      if [ -d "gh-pages/history" ]; then
        mkdir -p allure-results/history
        cp -r gh-pages/history/* allure-results/history/
      fi

  # 🧹 5. Keep only latest 10 trend entries
  - name: Trim Allure Trend History
    run: |
      if [ -d "allure-results/history" ]; then

        for file in history-trend.json duration-trend.json retry-trend.json categories-trend.json
        do
          if [ -f "allure-results/history/$file" ]; then
            jq '.[-10:]' "allure-results/history/$file" > tmp.json
            mv tmp.json "allure-results/history/$file"
          fi
        done

      fi

  # 🔍 6. Debug files
  - name: Debug files
    run: |
      echo "Allure Results:"
      ls -R allure-results || true

  # ✅ 7. Install Allure
  - name: Install Allure
    run: |
      curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.39.0/allure-2.39.0.tgz
      tar -zxvf allure.tgz
      sudo mv allure-2.39.0 /opt/allure
      sudo ln -s /opt/allure/bin/allure /usr/bin/allure
      allure --version

  # ✅ 8. Generate Allure Report
  - name: Generate Allure Report
    run: |
      allure generate allure-results --clean -o allure-report

  # 🎨 9. Customize Allure Report
  - name: Customize Allure Report
    run: |

      mkdir -p allure-report/app

      cp .github/allure-assets/rs-logo.png allure-report/app/rs-logo.png
      cp .github/allure-assets/styles.css allure-report/app/styles.css

      sed -i 's#</head>#<link rel="stylesheet" href="app/styles.css"></head>#' allure-report/index.html

      sed -i 's#<title>Allure Report</title>#<title>Test Report</title>#' allure-report/index.html

      cp .github/allure-assets/rs-favicon.ico allure-report/favicon.ico

      sed -i 's#href="assets/favicon[^"]*\.ico"#href="favicon.ico"#g' allure-report/index.html

      sed -i 's#"reportName":"Allure Report"#"reportName":"Test Report"#g' allure-report/widgets/summary.json

  # 🔥 10. Fix routing
  - name: Fix GitHub Pages routing
    run: |
      cp allure-report/index.html allure-report/404.html

  # 🚀 11. Deploy report
  - name: Deploy report to GitHub Pages
    uses: peaceiris/actions-gh-pages@v3
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: allure-report
```
