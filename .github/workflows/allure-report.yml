name: Generate & Publish Allure Report

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [allure-update]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repo
      - name: Checkout Reports repository
        uses: actions/checkout@v3

      # 🔐 Clone private results repo
      - name: Clone Allure Results (Private Repo)
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/TmpRSN/Allure-Results.git results-repo

      # 📁 Copy results
      - name: Prepare Allure Results
        run: |
          mkdir -p allure-results
          cp -r results-repo/allure-results/. allure-results/

      # 🔍 Debug (optional)
      - name: Debug Allure Results
        run: |
          echo "Listing files:"
          ls -R allure-results

      # ✅ Install Allure
      - name: Install Allure
        run: |
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.39.0/allure-2.39.0.tgz
          tar -zxvf allure.tgz
          sudo mv allure-2.39.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # ✅ Generate report
      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      # 🔥 FINAL FIX: routing + cache handling
      - name: Fix routing & caching
        run: |
          # SPA routing fix
          cp allure-report/index.html allure-report/404.html

          # Disable Jekyll processing
          touch allure-report/.nojekyll

          # Inject cache-busting meta + auto reload
          sed -i 's/<head>/<head>\
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />\
          <meta http-equiv="Pragma" content="no-cache" />\
          <meta http-equiv="Expires" content="0" />\
          <script>\
          if (!window.location.href.includes("reload=true")) {\
              window.location.href = window.location.href + (window.location.search ? "&" : "?") + "reload=true";\
          }\
          </script>/' allure-report/index.html

      # 🚀 Deploy to GitHub Pages
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
